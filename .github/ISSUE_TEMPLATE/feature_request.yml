name: "功能建议 / Feature request"
description: "建议新功能、交互改进或设备适配 / Suggest a feature, interaction improvement, or device support."
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议，描述实际使用场景。可使用中文或英文填写，无需提供代码实现。
        Please search existing requests and describe your use case. Chinese or English is welcome; an implementation is not required.

  - type: textarea
    id: problem
    attributes:
      label: "使用场景与问题 / Use case and problem"
      description: "你想完成什么？当前遇到什么不便？ / What are you trying to do, and what makes it difficult today?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "建议方案 / Proposed behavior"
      description: "说明希望增加或改变的行为，以及它如何解决问题。 / Describe the behavior you would like and how it addresses the problem."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案 / Alternatives"
      description: "是否尝试过现有设置或其他操作方式？ / Have you tried existing settings or another way to achieve this?"

  - type: textarea
    id: device_context
    attributes:
      label: "设备与交互场景（如适用） / Device and interaction context (if applicable)"
      description: "设备适配或交互建议可补充机型、Android / Wear OS、屏幕形状、表冠和操作场景。 / For device or interaction requests, include the model, Android / Wear OS, screen shape, rotary input, and usage context."

  - type: textarea
    id: additional_context
    attributes:
      label: "补充说明 / Additional context"
      description: "可附草图、截图或相关 Issue。 / Add mockups, screenshots, or related issues if helpful."
